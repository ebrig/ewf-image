name: Publish ewf-image

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-ewf-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ewf-image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      checks: read
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify tag and required checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-candidate.sh "$GITHUB_REF_NAME"

      - name: Publish dry run
        run: cargo publish -p ewf-image --dry-run --all-features --locked

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ewf-image --all-features --locked
