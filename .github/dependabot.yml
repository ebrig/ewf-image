version: 2
updates:
  - package-ecosystem: cargo
    # Include the isolated fuzz workspace in the same update group.
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
