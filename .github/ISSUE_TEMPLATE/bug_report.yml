name: Bug Report
description: >-
  Report a reproducible problem in ewf-image.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities or attach confidential forensic evidence
        here. Use [private vulnerability reporting](https://github.com/ebrig/ewf-image/security/advisories/new)
        for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest command, test, or code sample that reproduces the issue.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate version or commit hash.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: >-
        Include the platform, Rust version, format family, compression, segment
        count, and whether a non-sensitive shareable fixture exists.
