[package]
name = "aff4-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Bounded AFF4 evidence stream reading and writing"
repository = "https://github.com/ebrig/ewf-image"
publish = false

[dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
oxttl = "0.2"
oxrdf = "0.3"
flate2 = "1"
snap = "1"
lz4_flex = "0.14"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
