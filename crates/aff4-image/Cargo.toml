[package]
name = "aff4-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Bounded AFF4 evidence stream reading and writing"
repository = "https://github.com/ebrig/ewf-image"
publish = false

[features]
default = ["write", "cli"]
write = ["dep:tempfile", "dep:uuid", "dep:time", "dep:libc"]
cli = ["write", "dep:clap", "dep:ctrlc"]

[[bin]]
name = "aff4-image"
path = "src/bin/aff4-image.rs"
required-features = ["cli"]

[[example]]
name = "acquire"
required-features = ["write"]

[dev-dependencies]
tempfile = "3"

[dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
oxttl = "0.2"
oxrdf = "0.3"
flate2 = "1"
snap = "1"
lz4_flex = "0.14"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }
base64 = "0.22"
blake2 = "0.11"
time = { version = "0.3", features = ["formatting"], optional = true }
tempfile = { version = "3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[[test]]
name = "writer"
required-features = ["write"]

[[test]]
name = "collection"
required-features = ["cli"]

[[test]]
name = "collection_limits"
required-features = ["write"]

[[test]]
name = "cli"
required-features = ["cli"]
