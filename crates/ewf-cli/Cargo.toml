[package]
name = "ewf-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Unified EWF, AFF4, and raw evidence command line"
repository = "https://github.com/ebrig/ewf-image"
publish = false

[dependencies]
ewf-image = { path = "../..", features = ["verify", "serde"] }
aff4-image = { path = "../aff4-image", default-features = false, features = ["write"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
